# Disposable Postgres for the kind smoke test only. The Secret is created by scripts/kind-smoke.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_DB, value: pulsequeue }
            - { name: POSTGRES_USER, value: pulsequeue }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres, key: password }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "pulsequeue"] }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
