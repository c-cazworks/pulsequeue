# Local only (Docker Compose). On AWS, alerting uses CloudWatch: see infra/terraform/modules/monitoring.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  # DNS discovery finds every replica after `docker compose up --scale`.
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8000

  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100
