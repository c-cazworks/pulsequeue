# Each alert names its runbook section in docs/runbook.md. Tested by alerts.test.yml.
groups:
  - name: pulsequeue
    rules:
      - alert: ApiDown
        # Any healthy replica is enough: a replaced container's old target must not page.
        expr: max(up{job="api"}) == 0 or absent(up{job="api"})
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: The API is not answering scrapes
          runbook: docs/runbook.md#api-errors-or-api-down

      - alert: ApiHighErrorRate
        # The traffic floor stops one failed request on an idle system from paging.
        expr: |
          sum(rate(pulsequeue_http_requests_total{status=~"5.."}[5m]))
            / sum(rate(pulsequeue_http_requests_total[5m])) > 0.05
          and sum(rate(pulsequeue_http_requests_total[5m])) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $value | humanizePercentage }} of API requests are failing"
          runbook: docs/runbook.md#api-errors-or-api-down

      - alert: ApiSlow
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(pulsequeue_http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "API p95 latency is {{ $value | humanizeDuration }}"
          runbook: docs/runbook.md#api-slow

      - alert: WorkerDown
        expr: max(up{job="worker"}) == 0 or absent(up{job="worker"})
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: No worker is answering scrapes
          runbook: docs/runbook.md#queue-lag-or-worker-down

      # The thresholds below match the console's alerts (apps/api/app/alerts.py).
      - alert: QueueLag
        # max(): every worker replica reports the same queue. Events waiting out a retry
        # backoff are not counted: only ready events that no worker has picked up.
        expr: max(pulsequeue_queue_lag_seconds) > 30
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "Ready events have waited {{ $value | humanizeDuration }} for a worker"
          runbook: docs/runbook.md#queue-lag-or-worker-down

      - alert: DeliveryErrorRate
        # At least 20 attempts a minute, so one failure on a quiet event type does not page.
        expr: |
          sum by (event_type) (rate(pulsequeue_worker_events_total{outcome!="processed"}[1m]))
            / sum by (event_type) (rate(pulsequeue_worker_events_total[1m])) > 0.05
          and sum by (event_type) (rate(pulsequeue_worker_events_total[1m])) * 60 >= 20
        for: 30s
        labels: { severity: warning }
        annotations:
          summary: "{{ $value | humanizePercentage }} of {{ $labels.event_type }} deliveries are failing"
          runbook: docs/runbook.md#delivery-errors

      - alert: LatencySLOBreach
        # Each event type has its own objective, exported by the worker.
        expr: |
          histogram_quantile(0.95,
            sum by (event_type, le) (rate(pulsequeue_worker_event_duration_seconds_bucket[1m])))
          > on (event_type) max by (event_type) (pulsequeue_delivery_slo_seconds)
          and on (event_type)
            sum by (event_type) (rate(pulsequeue_worker_event_duration_seconds_count[1m])) * 60 >= 20
        for: 30s
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.event_type }} p95 delivery latency is {{ $value | humanizeDuration }}"
          runbook: docs/runbook.md#latency-slo-breach

      - alert: EventsDeadLettered
        expr: sum(increase(pulsequeue_worker_events_total{outcome="failed"}[5m])) > 0
        labels: { severity: warning }
        annotations:
          summary: "Events that exhausted their retries in 5 minutes: {{ $value | humanize }}"
          runbook: docs/runbook.md#events-dead-lettered
