{{- $ctx := dict "root" . "component" "api" "hpa" .Values.api.autoscaling -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "pq.labels" $ctx | nindent 4 }}
spec:
  # replicas is owned by the HPA
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "pq.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pq.labels" $ctx | nindent 8 }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45 # 10s preStop + 20s request drain + 5s pool close, plus slack
      securityContext:
        {{- include "pq.podSecurity" 10001 | nindent 8 }}
      {{- include "pq.spread" $ctx | nindent 6 }}
      containers:
        - name: api
          {{- include "pq.image" (dict "root" . "name" "api") | nindent 10 }}
          env:
            {{- include "pq.databaseEnv" . | nindent 12 }}
            - name: SIMULATION_ENABLED
              value: {{ .Values.simulator.allowSwitching | quote }}
          ports:
            - { name: http, containerPort: 8000 }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            timeoutSeconds: 3
          # Above the app's own 2s limit, so it answers 503 instead of timing out.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 4
          lifecycle:
            preStop:
              sleep: { seconds: 10 } # keep serving until endpoints update
          securityContext:
            {{- include "pq.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "pq.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "pq.selector" $ctx | nindent 4 }}
  ports:
    - { name: http, port: 8000, targetPort: http }
---
{{ include "pq.hpa" $ctx }}
---
{{ include "pq.pdb" $ctx }}
