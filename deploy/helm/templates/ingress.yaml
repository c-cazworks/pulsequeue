{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.allowedCidrs }}
{{- fail "ingress.allowedCidrs is required: without it the ALB is open to the world" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "pq.labels" (dict "root" . "component" "web") | nindent 4 }}
  annotations:
    # HTTP only: TLS needs a domain for an ACM certificate.
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/inbound-cidrs: {{ join "," .Values.ingress.allowedCidrs | quote }}
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-web
                port: { name: http }
{{- end }}
